name: PomodoroTimer
options:
  bundleIdPrefix: com.example   # App Store 올리기 전에 본인 것으로 변경
  deploymentTarget:
    iOS: "17.0"
targets:
  PomodoroTimer:
    type: application
    platform: iOS
    sources: [PomodoroTimer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pomodoro   # 본인 것으로 변경
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: PomodoroTimer/Info.plist
      properties:
        CFBundleDisplayName: Pomodoro
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIAppFonts: [Pretendard-Bold.otf, Pretendard-SemiBold.otf]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
