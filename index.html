<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimPo">
<meta name="theme-color" content="#2b2b30">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SimPo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#2b2b30;--fg:#ececf1;--card:#8e8e9f;--digit:#fff;--hinge:rgba(0,0,0,.28);--shadow:rgba(0,0,0,.35);
  --ui:#ececf1;--ui-dim:#7d7d88;--btn:#3b3b42}
body.light{--bg:#fff;--fg:#111;--card:#e4e4ea;--digit:#2b2b30;--hinge:rgba(0,0,0,.12);--shadow:rgba(0,0,0,.12);
  --ui:#111;--ui-dim:#9a9a9a;--btn:#efefef}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ui);font-family:Pretendard,-apple-system,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}

/* ---------- 설정 화면 ---------- */
#setup{gap:min(6vh,40px)}
.picker{display:flex;align-items:center;gap:min(6vw,40px)}
.picker>button{width:56px;height:56px;border-radius:50%;background:var(--btn);font-size:30px;line-height:1}
.mins{display:flex;align-items:baseline;gap:6px;min-width:3.2ch;justify-content:center}
#minsVal{font-size:min(26vw,22vh);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.mins small{font-size:18px;color:var(--ui-dim)}
.presets{display:flex;gap:10px}
.presets button{width:52px;height:36px;border-radius:999px;background:var(--btn);font-size:15px;font-weight:600;color:var(--ui-dim)}
#start{padding:16px 64px;border-radius:999px;background:var(--ui);color:var(--bg);font-size:20px;font-weight:700}

/* ---------- 플립 시계 ---------- */
.flip{--cw:min(40vw,52vh);display:flex;gap:calc(var(--cw)*.07)}
.flip.three{--cw:min(28vw,48vh)}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.1);perspective:calc(var(--cw)*4);
  border-radius:calc(var(--cw)*.09);font-size:calc(var(--cw)*.72);font-weight:700;color:var(--digit);
  box-shadow:0 calc(var(--cw)*.03) calc(var(--cw)*.08) var(--shadow)}
.card::after{content:"";position:absolute;left:0;right:0;top:50%;height:max(1px,calc(var(--cw)*.012));
  transform:translateY(-50%);background:var(--hinge);z-index:5}
.h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card)}
.h.t{top:0;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;transform-origin:50% 100%}
.h.b{bottom:0;border-radius:inherit;border-top-left-radius:0;border-top-right-radius:0;transform-origin:50% 0}
.h span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.h.t span{top:0}.h.b span{bottom:0}
.h.f{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.card.go .t.f{animation:fold .28s ease-in forwards}
.card.go .b.f{transform:rotateX(90deg);animation:unfold .28s .28s ease-out forwards}
@keyframes fold{to{transform:rotateX(-90deg)}}
@keyframes unfold{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}

/* ---------- 다이얼 ---------- */
#dial{width:min(90vw,86vh);height:min(90vw,86vh)}
#wedge{fill:var(--fg)}
#face{fill:var(--fg);stroke:var(--fg)}
#faceInv{fill:var(--bg);stroke:var(--bg)}
#dial text{font-family:inherit;font-weight:700;font-size:44px;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}

#run .flip,#run #dial{display:none}
body:not(.dial) #run .flip{display:flex}
body.dial #run #dial{display:block}
.ended .flip,.ended #dial{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- 실행 중 컨트롤 ---------- */
.ctrl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 28px);display:flex;justify-content:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.ctrl.on{opacity:1;pointer-events:auto}
.ctrl button{padding:12px 26px;border-radius:999px;background:var(--btn);font-size:16px;font-weight:600}

/* ---------- 라이트/다크 전환 ---------- */
.theme{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--btn)}
.ctrl .theme{padding:0}
.theme svg{width:22px;height:22px}
#setup .theme{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:calc(env(safe-area-inset-right) + 16px)}
</style>
</head>
<body>

<section id="setup" class="screen on">
  <button class="theme" aria-label="라이트/다크 전환"></button>
  <div class="picker">
    <button id="minus" aria-label="1분 감소">−</button>
    <div class="mins"><span id="minsVal">25</span><small>분</small></div>
    <button id="plus" aria-label="1분 증가">+</button>
  </div>
  <div class="presets">
    <button data-m="5">5</button><button data-m="15">15</button><button data-m="25">25</button><button data-m="50">50</button>
  </div>
  <button id="start">시작</button>
</section>

<section id="run" class="screen">
  <div class="flip" id="flip"></div>
  <svg id="dial" viewBox="-110 -110 220 220">
    <defs><clipPath id="wclip"><path id="wedgeClip"/></clipPath></defs>
    <path id="wedge"/>
    <g id="face"></g>
    <g id="faceInv" clip-path="url(#wclip)"></g>
  </svg>
  <div class="ctrl" id="ctrl">
    <button id="pause">일시정지</button>
    <button id="stop">처음으로</button>
    <button id="modeBtn" class="theme" aria-label="플립/다이얼 전환"></button>
    <button class="theme" aria-label="라이트/다크 전환"></button>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let mode = store.get('mode', 'flip');
let mins = store.get('mins', 25);
let total = 0, endAt = 0, remainMs = 0, paused = false, running = false, done = false, raf = 0;

/* ---------- 설정 화면 ---------- */
const ICON = {
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  flip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="8.5" height="12" rx="2"/><rect x="13" y="6" width="8.5" height="12" rx="2"/><path d="M2.5 12h19"/></svg>',
  dial: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M12 12V2.5A9.5 9.5 0 0 1 21.5 12z" fill="currentColor"/></svg>'
};
let theme = store.get('theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function applyTheme() {
  document.body.classList.toggle('light', theme === 'light');
  $('meta[name=theme-color]').content = theme === 'light' ? '#ffffff' : '#2b2b30';
  document.querySelectorAll('.theme:not(#modeBtn)').forEach(b => b.innerHTML = theme === 'light' ? ICON.moon : ICON.sun);
}
document.querySelectorAll('.theme:not(#modeBtn)').forEach(b => b.onclick = e => {
  e.stopPropagation();
  theme = theme === 'light' ? 'dark' : 'light';
  store.set('theme', theme);
  applyTheme();
  if (running) showCtrl();
});

/* 실행 화면에서 플립/다이얼 전환 (버튼엔 바뀔 모드의 아이콘) */
function applyMode() {
  document.body.classList.toggle('dial', mode === 'dial');
  $('#modeBtn').innerHTML = mode === 'dial' ? ICON.flip : ICON.dial;
}
$('#modeBtn').onclick = e => {
  e.stopPropagation();
  mode = mode === 'dial' ? 'flip' : 'dial';
  store.set('mode', mode);
  applyMode();
  render();
  showCtrl();
};
function setMins(m) {
  mins = Math.min(180, Math.max(1, m));
  $('#minsVal').textContent = mins;
  store.set('mins', mins);
}
document.querySelectorAll('.presets button').forEach(b => b.onclick = () => setMins(+b.dataset.m));
$('#minus').onclick = () => setMins(mins - 1);
$('#plus').onclick = () => setMins(mins + 1);
$('#start').onclick = start;

/* ---------- 플립 카드 ---------- */
function makeCard() {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = '<div class="h t"><span></span></div><div class="h b"><span></span></div>' +
                '<div class="h t f"><span></span></div><div class="h b f"><span></span></div>';
  c.val = null;
  return c;
}
function setCard(c, v) {
  if (c.val === v) return;
  const [t, b, ft, fb] = c.querySelectorAll('span');
  const old = c.val;
  c.val = v;
  c.classList.remove('go');
  if (old === null) { t.textContent = b.textContent = ft.textContent = fb.textContent = v; return; }
  t.textContent = v; b.textContent = old; ft.textContent = old; fb.textContent = v;
  void c.offsetWidth;
  c.classList.add('go');
  clearTimeout(c.tm);
  c.tm = setTimeout(() => { b.textContent = v; }, 560);
}
let cards = [];
function buildFlip(withHours) {
  const f = $('#flip');
  f.innerHTML = '';
  f.classList.toggle('three', withHours);
  cards = Array.from({ length: withHours ? 3 : 2 }, makeCard);
  cards.forEach(c => f.appendChild(c));
}

/* ---------- 다이얼 ---------- */
function buildFace() {
  let s = '';
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI / 30, big = i % 5 === 0;
    const r1 = big ? 90 : 96, r2 = 104;
    s += `<line x1="${r1 * Math.sin(a)}" y1="${-r1 * Math.cos(a)}" x2="${r2 * Math.sin(a)}" y2="${-r2 * Math.cos(a)}" stroke-width="${big ? 3 : 1.4}" stroke-linecap="round"/>`;
  }
  s += '<text class="dm" y="-24" stroke="none"></text><text class="ds" y="24" stroke="none"></text>';
  $('#face').innerHTML = s;
  $('#faceInv').innerHTML = s;
}
function wedgePath(p) {
  const r = 86;
  if (p >= 0.9999) return `M0,${-r}A${r},${r} 0 1 1 0,${r}A${r},${r} 0 1 1 0,${-r}Z`;
  if (p <= 0) return '';
  const a = p * 2 * Math.PI;
  return `M0,0L0,${-r}A${r},${r} 0 ${p > 0.5 ? 1 : 0} 1 ${r * Math.sin(a)},${-r * Math.cos(a)}Z`;
}

/* ---------- 타이머 ---------- */
const pad = n => String(n).padStart(2, '0');
const remaining = () => paused ? remainMs : Math.max(0, endAt - Date.now());

function render() {
  const ms = remaining();
  const sec = Math.ceil(ms / 1000);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (mode === 'flip') {
    const vals = cards.length === 3 ? [pad(h), pad(m), pad(s)] : [pad(m), pad(s)];
    cards.forEach((c, i) => setCard(c, vals[i]));
  } else {
    const d = wedgePath(ms / (total * 1000));
    $('#wedge').setAttribute('d', d);
    $('#wedgeClip').setAttribute('d', d);
    const top = h ? `${h}:${pad(m)}` : pad(m);
    document.querySelectorAll('#dial .dm').forEach(t => t.textContent = top);
    document.querySelectorAll('#dial .ds').forEach(t => t.textContent = pad(s));
  }
  if (ms <= 0 && !done) finish();
}
function loop() {
  cancelAnimationFrame(raf);
  render();
  if (running && !done) raf = requestAnimationFrame(loop);
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}
function start() {
  total = mins * 60;
  endAt = Date.now() + total * 1000;
  paused = false; done = false; running = true;
  $('#pause').textContent = '일시정지';
  document.body.classList.remove('ended');
  unlockAudio();
  wake(true);
  buildFlip(total >= 3600);
  show('run');
  loop();
}
function stop() {
  running = false; done = false;
  cancelAnimationFrame(raf);
  document.body.classList.remove('ended');
  hideCtrl();
  wake(false);
  show('setup');
}
function finish() {
  done = true;
  document.body.classList.add('ended');
  chime();
}
$('#pause').onclick = e => {
  e.stopPropagation();
  if (done) return;
  if (paused) { endAt = Date.now() + remainMs; paused = false; $('#pause').textContent = '일시정지'; loop(); }
  else { remainMs = remaining(); paused = true; $('#pause').textContent = '계속'; }
  showCtrl();
};
$('#stop').onclick = e => { e.stopPropagation(); stop(); };

/* 실행 화면 탭: 컨트롤 표시 / 종료 후엔 처음으로 */
let ctrlTimer = 0;
function showCtrl() {
  $('#ctrl').classList.add('on');
  clearTimeout(ctrlTimer);
  if (!paused) ctrlTimer = setTimeout(hideCtrl, 3000);
}
function hideCtrl() { $('#ctrl').classList.remove('on'); }
$('#run').onclick = () => {
  if (done) { stop(); return; }
  $('#ctrl').classList.contains('on') && !paused ? hideCtrl() : showCtrl();
};

/* ---------- 소리 ---------- */
let ac = null;
function unlockAudio() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    g.gain.value = 0; o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.01);
  } catch {}
}
function chime() {
  if (!ac) return;
  ac.resume();
  const t0 = ac.currentTime + 0.05;
  for (let i = 0; i < 6; i++) {
    const t = t0 + i * 0.3 + (i >= 3 ? 0.5 : 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.4, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.25);
  }
}

/* ---------- 화면 꺼짐 방지 ---------- */
let lock = null;
async function wake(on) {
  try {
    if (on && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen');
    else if (!on && lock) { await lock.release(); lock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) { wake(true); if (!done) loop(); }
});

buildFace();
applyTheme();
applyMode();
setMins(mins);
</script>
</body>
</html>
